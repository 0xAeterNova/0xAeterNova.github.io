<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>0xAeterNova — Hardware & Shader Diagnostics</title>
  <style>
    body { background: #020308; color: #00f0ff; font-family: monospace; padding: 32px; line-height: 1.6; }
    .diag-box { border: 1px solid #00f0ff44; padding: 18px; margin-bottom: 16px; background: #060c16; }
    .ok { color: #00ff66; font-weight: bold; }
    .warn { color: #ffaa00; }
  </style>
</head>
<body>
  <h2>[ 0xAeterNova HARDWARE & RUNTIME DIAGNOSTICS ]</h2>
  <div id="results"></div>
  <script>
    const out = document.getElementById("results");
    const check = (label, status, detail) => {
      out.innerHTML += `<div class="diag-box"><div><strong>${label}</strong>: <span class="${status.toLowerCase()}">${status}</span></div><div>${detail}</div></div>`;
    };

    const canvas = document.createElement("canvas");
    const gl = canvas.getContext("webgl2") || canvas.getContext("webgl");
    if (gl) {
      const dbg = gl.getExtension('WEBGL_debug_renderer_info');
      const gpu = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : "Generic GPU";
      check("WebGL Context", "OK", `Renderer: ${gpu}`);
    } else {
      check("WebGL Context", "WARN", "WebGL is unavailable on this device.");
    }

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (AudioCtx) {
      check("WebAudio API", "OK", "Synthesizer & Spatial Nodes Supported.");
    } else {
      check("WebAudio API", "WARN", "Audio Context Unsupported.");
    }

    check("Viewport Telemetry", "OK", `Resolution: ${window.innerWidth}x${window.innerHeight}, DPR: ${window.devicePixelRatio}`);
  </script>
</body>
</html>
