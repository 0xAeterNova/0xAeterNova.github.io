<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>0xAeterNova Diagnostics</title><style>body{margin:0;background:#07070b;color:#f8f4ea;font-family:ui-monospace,monospace;padding:32px}.box{max-width:900px;margin:auto;border:1px solid #333;border-radius:24px;padding:24px;background:#0c0c12}h1{font-family:Arial Black,sans-serif;font-size:48px;letter-spacing:-.05em}.ok{color:#80ffb1}.bad{color:#ff705c}pre{white-space:pre-wrap;line-height:1.7;color:#c7c7d0}canvas{width:100%;height:220px;border-radius:16px;background:#020205}</style></head><body><div class="box"><h1>INTERFACE ZERO<br>DIAGNOSTICS</h1><p id="status"></p><pre id="info"></pre><canvas id="c"></canvas><p><a style="color:#ff795c" href="index.html">← Portfolio</a></p></div><script>const c=document.querySelector('#c'),s=document.querySelector('#status'),i=document.querySelector('#info');const gl=c.getContext('webgl2');if(!gl){s.className='bad';s.textContent='✕ WebGL2 is unavailable. Enable browser hardware acceleration and update the graphics driver.';i.textContent='User agent: '+navigator.userAgent}else{const ext=gl.getExtension('WEBGL_debug_renderer_info');s.className='ok';s.textContent='✓ WebGL2 context created successfully.';i.textContent=['WebGL: '+gl.getParameter(gl.VERSION),'GLSL: '+gl.getParameter(gl.SHADING_LANGUAGE_VERSION),'Vendor: '+(ext?gl.getParameter(ext.UNMASKED_VENDOR_WEBGL):gl.getParameter(gl.VENDOR)),'Renderer: '+(ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER)),'Max texture: '+gl.getParameter(gl.MAX_TEXTURE_SIZE),'Max renderbuffer: '+gl.getParameter(gl.MAX_RENDERBUFFER_SIZE)].join('\n');c.width=900;c.height=220;gl.viewport(0,0,c.width,c.height);gl.clearColor(.02,.02,.05,1);gl.clear(gl.COLOR_BUFFER_BIT);}</script></body></html>
